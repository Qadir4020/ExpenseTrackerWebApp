<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Expense Tracker</title>
</head>
<body>

<h1>Expense Tracker</h1>

<h2>Dashboard</h2>

<p>Total Income: <span th:text="${income}"></span></p>
<p>Total Expense: <span th:text="${expense}"></span></p>
<p>Balance: <span th:text="${balance}"></span></p>

<hr>

<form action="/add" method="post">

    <input type="text" name="title" placeholder="Title">

    <input type="number" step="0.01"
           name="amount" placeholder="Amount">

    <input type="text" name="category"
           placeholder="Category">

    <button type="submit">Add</button>

    <select name="type">
        <option value="INCOME">Income</option>
        <option value="EXPENSE">Expense</option>
    </select>
</form>

<hr>

<h2>Transactions</h2>

<table border="1">

    <tr>
        <th>Title</th>
        <th>Amount</th>
        <th>Category</th>
        <th>Date</th>
    </tr>

    <tr th:each="transaction : ${transactions}">
        <td th:text="${transaction.title}"></td>
        <td th:text="${transaction.amount}"></td>
        <td th:text="${transaction.category}"></td>
        <td th:text="${transaction.date}"></td>

        <td>
            <a th:href="@{'/delete/' + ${transaction.id}}">Delete</a>
        </td>

        <td>
            <a th:href="@{'/edit/' + ${transaction.id}}">Edit</a>
        </td>
    </tr>

</table>

</body>
</html>
