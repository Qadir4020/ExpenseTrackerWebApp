<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExpenseTracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="shell">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon">💸</div>
      <div class="logo-text">Expense<span>Tracker</span></div>
    </div>

    <div class="summary-cards">
      <div class="sum-card income">
        <div class="label">↑ Income</div>
        <div class="value" id="total-income">—</div>
      </div>
      <div class="sum-card expense">
        <div class="label">↓ Expense</div>
        <div class="value" id="total-expense">—</div>
      </div>
      <div class="sum-card balance">
        <div class="label">◈ Balance</div>
        <div class="value" id="total-balance">—</div>
      </div>
    </div>

    <div class="sidebar-footer">
      <div class="status-dot"></div>
      Connected to API
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <h1>Transactions</h1>
      <div class="topbar-actions">
        <div class="filter-tabs">
          <button class="filter-tab active" data-filter="ALL">All</button>
          <button class="filter-tab" data-filter="INCOME">Income</button>
          <button class="filter-tab" data-filter="EXPENSE">Expense</button>
        </div>
        <button class="btn-add" id="btn-open-add">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 2a.75.75 0 0 1 .75.75v4.5h4.5a.75.75 0 0 1 0 1.5h-4.5v4.5a.75.75 0 0 1-1.5 0v-4.5h-4.5a.75.75 0 0 1 0-1.5h4.5v-4.5A.75.75 0 0 1 8 2Z"/></svg>
          Add
        </button>
      </div>
    </div>

    <div class="content">
      <div id="tx-list" class="tx-list">
        <div class="spinner"></div>
      </div>
    </div>
  </main>
</div>

<!-- MODAL -->
<div class="overlay" id="modal-overlay" style="display:none;">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-header">
      <h2 id="modal-title">Add transaction</h2>
      <button class="modal-close" id="btn-modal-close" aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>

    <form id="tx-form" autocomplete="off">
      <input type="hidden" id="tx-id" />

      <div class="form-group">
        <label>Type</label>
        <div class="type-toggle">
          <button type="button" class="type-btn selected-income" data-type="INCOME" id="btn-type-income">↑ Income</button>
          <button type="button" class="type-btn" data-type="EXPENSE" id="btn-type-expense">↓ Expense</button>
        </div>
      </div>

      <div class="form-group">
        <label for="tx-title">Title</label>
        <input type="text" id="tx-title" placeholder="e.g. Grocery shopping" required />
      </div>

      <div class="form-group">
        <label for="tx-amount">Amount</label>
        <input type="number" id="tx-amount" placeholder="0.00" step="0.01" min="0.01" required />
      </div>

      <div class="form-group">
        <label for="tx-category">Category</label>
        <select id="tx-category" required>
          <option value="" disabled selected>Select a category</option>
          <optgroup label="Income">
            <option>Salary</option>
            <option>Freelance</option>
            <option>Investment</option>
            <option>Gift</option>
            <option>Other Income</option>
          </optgroup>
          <optgroup label="Expense">
            <option>Food</option>
            <option>Transport</option>
            <option>Housing</option>
            <option>Entertainment</option>
            <option>Healthcare</option>
            <option>Shopping</option>
            <option>Education</option>
            <option>Utilities</option>
            <option>Other Expense</option>
          </optgroup>
        </select>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-cancel" id="btn-modal-cancel">Cancel</button>
        <button type="submit" class="btn-submit" id="btn-submit">Save transaction</button>
      </div>
    </form>
  </div>
</div>

<!-- DELETE CONFIRM MODAL -->
<div class="overlay" id="confirm-overlay" style="display:none;">
  <div class="confirm-modal">
    <div class="confirm-icon">🗑️</div>
    <div class="confirm-title">Delete transaction?</div>
    <div class="confirm-desc">This action cannot be undone.</div>
    <div class="confirm-actions">
      <button type="button" class="btn-cancel" id="btn-confirm-cancel">Cancel</button>
      <button type="button" class="btn-confirm-del" id="btn-confirm-delete">Delete</button>
    </div>
  </div>
</div>

<!-- TOAST CONTAINER -->
<div class="toast-container" id="toast-container"></div>

<script src="app.js"></script>
</body>
</html>
